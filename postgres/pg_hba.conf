# pg_hba.conf pour la base de DÉMO (db-demo) — remplace entièrement celui
# généré par défaut par l'image postgres officielle (voir le montage dans
# docker-compose.demo.yml), pour ajouter un accès externe restreint à
# Looker Studio SANS ouvrir la base à tout Internet. Jamais appliqué à la
# prod (docker-compose.prod.yml reste sans port publié) : même fichier
# réutilisable tel quel si la prod devait un jour l'adopter aussi, le nom
# de base/rôle ("prepastan"/"looker_ro") est identique des deux côtés.
#
# Règles évaluées dans l'ordre, la première qui correspond gagne. Aucune
# règle générique "host all all 0.0.0.0/0" n'existe ici : une IP qui
# n'apparaît dans aucune ligne ci-dessous est refusée, même si le pare-feu
# du serveur était mal configuré (défense en profondeur, voir le pare-feu
# dans la section "Connexion Looker Studio" du README).
#
# TYPE    DATABASE        USER            ADDRESS                     METHOD

# Connexions locales (exec dans le conteneur, ex. psql manuel, scripts
# d'admin) : confiance implicite (comme dans le pg_hba.conf généré par
# défaut), l'accès est déjà protégé par la capacité à faire `docker exec`
# dans le conteneur — exiger un mot de passe en plus ici cassait les
# commandes non interactives (`docker compose exec -T ... -f - < script`,
# aucun moyen de taper un mot de passe, constaté au déploiement initial).
local     all             all                                         trust
host      all             all             127.0.0.1/32                trust

# Réseau Docker interne (conteneur "app") : toute la plage privée que
# Docker peut attribuer à un réseau de pont, pas une IP figée qui changerait
# selon l'ordre de création des conteneurs.
host      all             all             172.16.0.0/12               scram-sha-256

# Looker Studio (lecture seule, voir "Connexion Looker Studio" du README) :
# uniquement le rôle looker_ro (créé par scripts/creer-role-looker-studio.sql),
# uniquement en SSL (hostssl, pas host), uniquement depuis la plage IP que
# Google publie pour ce connecteur. À mettre à jour si Google la fait
# évoluer (vérifier https://support.google.com/looker-studio/answer/7288010
# avant de modifier cette ligne).
hostssl   prepastan       looker_ro       142.251.74.0/23              scram-sha-256
hostssl   prepastan       looker_ro       2001:4860:4807::/48         scram-sha-256
